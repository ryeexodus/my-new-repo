<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>This is page 2</h1>

    <button onclick = "doSomething()" style = "font-size: 24px; background-color: lightblue; color: black; border: 2px solid black; padding: 10px 20px; border-radius: 5px; cursor: pointer;" >

    <script>
        function doSomething(){
            document.getElementById("greeting").innerHTML = "Goodbye";
        }
    </script>
