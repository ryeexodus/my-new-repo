<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form action = "index.php" method = "post" enctype = "multipart/form-data">
        
        
        <label for="username">Username: </label>
        
        <input type = "text" id = "username" placeholder="Enter your username" minlength="6" maxlength="15" required>


        <label for="password">Password: </label>
        <input type ="password" id = "password" placeholder="Enter your password" minlength="8" maxlength="20" required> <br>

        <label for="email">Email: </label>
        <input type = "email" id = "email" placeholder = "Sample@email.com" required><br>

        <label for="phone #: ">Phone: </label>
        <input type = "tel" id = "phone" placeholder = "1234-567-8910" pattern = "[0-9]{4}-[0-9]{3}-[0-9]{4}"><br>

        <label for = "birthday">Birthday: </label>
        <input type = "date" id = "birthday"><br>

        <label for = "quantity">Quantity: </label>
        <input type = "number" id = "quantity" min = "0" max = "99"><br>

        <label for ="title">Mr: </label>
        <input type = "radio" id = "Mr" value = "Mr" name = "title">

        <label for ="title">Ms: </label>
        <input type = "radio" id = "Ms" value = "Ms" name = "title">

        <label for ="title">Mrs: </label>
        <input type = "radio" id = "Mrs" value = "Mrs" name = "title"><br>

        <br>

        <label for = "payment">Payment Method: </label>

        <select name = "payment" id = "payment">
            <option value = "visa">Visa</option>
            <option value = "mastercard">Mastercard</option>
            <option value = "paypal">Paypal</option>
            <option value = "applepay">Apple Pay</option>
            <option value = "gcash">Gcash</option>
        </select> <br>
        <br>

        <label for = "subscribe">Subscribe to newsletter: </label>
        <input type = "checkbox" id = "subscribe" name = "subscribe" value = "yes"> <br>

        <label for = "comments">Comments: </label>
        <textarea name = "comments" id = "comments" cols = "30" rows = "10" placeholder = "Enter your comments here..."></textarea> <br>
    

        <label for = "file">File: </label>
        <input type = "file" id = "file" accept = "image/png, image/jpeg"> <br>
    
        <input type = "reset"> <br>
        <input type = "submit">
    


    </form>
    
</body>
</html>
